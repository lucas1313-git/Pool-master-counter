<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Master Counter - Cues</title>
<style>
  :root { --bg: #1a0a0a; --panel: #241010; --accent: #e8b923; --text: #f6efe9; --text-dim: #c9a2a2; --border: #4a1e1e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.3rem; color: var(--accent); }
  header nav { display: flex; gap: 8px; flex-wrap: wrap; }
  a.btn { font: inherit; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; text-decoration: none; display: inline-flex; align-items: center; min-height: 36px; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
</style>
</head>
<body>
<header>
  <h1>🎞️ Cues</h1>
  <nav>
    <a class="btn" href="record.html" target="pmc-record">🎬 Recording</a>
    <a class="btn" href="index.html">← Scoreboard</a>
  </nav>
</header>
<main><div id="viewer"></div></main>
<script src="js/cue-viewer.js?v=20261025a"></script>
<script>
  // Every cue and every recording (js/cue-viewer.js): watch a cue straight
  // from the recording, set its start and end by hand, export it as a clip;
  // each recording's timeline, a click plays from there.
  window.PMCCues = window.PMCCueViewer.mount(document.getElementById("viewer"), { sessions: true });
</script>
</body>
</html>
